[package]
name = "pv-transpiler"
version = "3.7.0"
edition = "2021"
description = "Lexer, LALRPOP grammar, and AST for the PlainVulkan (.pv) language"

[lib]
name = "pv_transpiler"
path = "src/lib.rs"

[[bin]]
name = "pvc"
path = "src/bin/pvc.rs"

[dependencies]
lalrpop-util = { version = "0.20", features = ["lexer"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
lalrpop = { version = "0.20", default-features = false }

[dev-dependencies]
