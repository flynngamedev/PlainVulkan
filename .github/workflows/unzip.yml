name: Move Files to Root
on:
  workflow_dispatch: # Allows you to run this manually on mobile

permissions:
  contents: write

jobs:
  move-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move files out of subfolder
        run: |
          # Move all hidden and non-hidden files from the folder to the root
          mv plainvulkan_v3.7/* . 2>/dev/null || true
          mv plainvulkan_v3.7/.* . 2>/dev/null || true
          
          # Delete the now empty folder
          rm -rf plainvulkan_v3.7

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add .
          git commit -m "Move all project files directly to the root folder"
          git push

